[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azdo-analyzer"
version = "0.1.0"
description = "Read-only Azure DevOps Server analysis for planning AZDO -> GitLab migrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "XlsxWriter>=3.1",
  "Jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "openpyxl>=3.1"]

[project.scripts]
azdo-analyzer = "azdo_analyzer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
